{% extends "base.html" %}

{% block title %}500 Server Error — FINDORA{% endblock %}

{% block content %}
<div class="page-content">
  <div class="container container-sm text-center" style="padding: 4rem 1rem;">
    <div style="font-size: 5rem; font-weight: 900; color: var(--warning); line-height: 1;">500</div>
    <h2 style="margin: 1rem 0;">Internal Server Error</h2>
    <p>An unexpected error occurred while processing your request. Please try again or return to the main dashboard.</p>
    <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center;">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">My Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
