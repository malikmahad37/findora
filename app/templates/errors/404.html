{% extends "base.html" %}

{% block title %}404 Not Found — FINDORA{% endblock %}

{% block content %}
<div class="page-content">
  <div class="container container-sm text-center" style="padding: 4rem 1rem;">
    <div style="font-size: 5rem; font-weight: 900; color: var(--primary); line-height: 1;">404</div>
    <h2 style="margin: 1rem 0;">Page Not Found</h2>
    <p>The page or item listing you are looking for does not exist or has been removed.</p>
    <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center;">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
      <a href="{{ url_for('main.browse') }}" class="btn btn-secondary">Browse Items</a>
    </div>
  </div>
</div>
{% endblock %}
